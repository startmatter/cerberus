# Cerberus — GitLab CI template.
#
# In the repo's .gitlab-ci.yml:
#
#   include:
#     - remote: https://raw.githubusercontent.com/startmatter/cerberus/main/templates/gitlab-ci.yml
#
# One CI variable enables merge-request comments — set it group-level so
# every repo inherits it:
#   CERBERUS_GITLAB_TOKEN — a bot token (project/group access token, `api`
#   scope) used only to post the scan report as a merge-request note.
#   GitLab's own CI_JOB_TOKEN cannot do this: its API access is read-only for
#   merge-request notes. Same pattern already used in production for
#   codex-review's own MR commenting (CODEX_GITLAB_BOT_TOKEN). Without it the
#   scan still runs and still gates — you just don't get the MR comment, only
#   the job log.
#
# A merge-request pipeline gates only on findings in files the MR actually
# touches. A default-branch push or a scheduled sweep gates on everything
# the scan finds — that's what lets a nightly dependency scan fail at all,
# since nothing "changed" that day. A tag/release pipeline never gates: the
# tagged commit was already scanned and gated on its merge request, so
# re-running an unscoped sweep here would fail releases over pre-existing,
# unrelated CVEs instead of anything that release actually changed.
#
# If the image is private (ghcr packages are private unless the organization
# allows public ones), add a group variable so the runner can pull it:
#   DOCKER_AUTH_CONFIG (type: File is not needed — plain variable):
#     {"auths":{"ghcr.io":{"auth":"BASE64_OF_username:github_pat_with_read:packages"}}}
#   Build the value with:
#     printf '%s' 'USER:TOKEN' | base64
#
# For a nightly dependency sweep, add a scheduled pipeline — new CVEs land in
# unchanged code, so pushes alone never surface them.

.cerberus:
  image:
    name: ghcr.io/startmatter/cerberus:latest
    # The runner starts the job through a shell, so the image's own entrypoint
    # must step aside — otherwise it receives the shell's flags as arguments
    # and the job dies with "Unknown option '-c'".
    entrypoint: [""]
  variables:
    # Full history: changed-file detection diffs against the MR's base commit.
    GIT_DEPTH: "0"
  script:
    - cerberus scan
  rules:
    - when: always

cerberus:
  extends: .cerberus
  # `.post` exists in every pipeline, whatever stages the project defines —
  # a hardcoded stage breaks the projects that do not happen to have it.
  stage: .post

# Opt in by defining a scheduled pipeline with SECURITY_NIGHTLY=true.
cerberus:nightly:
  extends: .cerberus
  stage: .post
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule" && $SECURITY_NIGHTLY == "true"
