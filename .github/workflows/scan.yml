# Reusable Cerberus scan + merge gate.
#
# Call it from a repository like this:
#
#   jobs:
#     security:
#       uses: startmatter/cerberus/.github/workflows/scan.yml@main
#       with:
#         runner: self-hosted
#         dns: 1.1.1.1,8.8.8.8      # self-hosted runners behind a VPN resolver
#
# A pull request gates only on findings in files the change touches; every
# other run (a push to the default branch, a scheduled sweep) gates on
# everything the scan finds. There's no backend and nothing to configure —
# the scan always runs.
name: Cerberus

# Permissions are inherited from the caller on purpose. Declaring them here
# *demands* them: a repository whose organization grants workflows read-only
# access cannot satisfy `pull-requests: write`, and GitHub rejects the run
# before a single job starts — the scan never happens at all.
#
# Inheriting means the scan always runs. Where the caller's token can write to
# pull requests, the report is posted as a comment; where it cannot, the report
# still lands in the job summary.

on:
  workflow_call:
    inputs:
      runner:
        description: "Runner label: ubuntu-latest, or self-hosted"
        type: string
        default: ubuntu-latest
        required: false
      gate:
        description: "Fail the job on qualifying findings (default true)."
        type: boolean
        default: true
        required: false
      dns:
        description: "Comma-separated DNS servers for the scan container. Needed when the runner's resolver is unreachable from containers — without it Semgrep fetches no rules and Trivy no vulnerability database, and both quietly produce nothing."
        type: string
        default: ""
        required: false
      path:
        description: "Directory to scan."
        type: string
        default: "."
        required: false
      image:
        description: "Cerberus image to run."
        type: string
        default: ghcr.io/startmatter/cerberus:latest
        required: false
    secrets:
      # Only needed when the image is private and the caller is in another
      # organization — the job's own token cannot read it then.
      REGISTRY_TOKEN:
        required: false

jobs:
  scan:
    runs-on: ${{ inputs.runner }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Gitleaks scans the whole history

      - name: Run Cerberus
        uses: startmatter/cerberus@main
        with:
          gate: ${{ inputs.gate }}
          dns: ${{ inputs.dns }}
          path: ${{ inputs.path }}
          image: ${{ inputs.image }}
          registry-token: ${{ secrets.REGISTRY_TOKEN || github.token }}
